<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Novely</title>
  <desc>Three books on a shelf spell an N: two cream books stand upright and a gold book leans between them as the diagonal, on deep night indigo.</desc>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1f80"/>
      <stop offset="1" stop-color="#150f45"/>
    </linearGradient>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="184"/></clipPath>
  </defs>
  <g clip-path="url(#body)"><rect x="100" y="100" width="824" height="824" fill="url(#field)"/></g>
  <!-- the standing books: the uprights of the N -->
  <g fill="#fbf3e2">
    <rect x="298" y="254" width="112" height="516" rx="14"/>
    <rect x="614" y="254" width="112" height="516" rx="14"/>
  </g>
  <g fill="#cdbfa0">
    <rect x="298" y="306" width="112" height="12"/><rect x="298" y="704" width="112" height="12"/>
    <rect x="614" y="306" width="112" height="12"/><rect x="614" y="704" width="112" height="12"/>
  </g>
  <!-- the leaning book: the diagonal -->
  <g transform="rotate(-21 600 770)">
    <rect x="600" y="236" width="124" height="534" rx="14" fill="#f4b25f"/>
    <rect x="600" y="296" width="124" height="14" fill="#c97a2c"/>
    <rect x="600" y="696" width="124" height="14" fill="#c97a2c"/>
    <rect x="638" y="430" width="48" height="120" rx="6" fill="#ffe2ae"/>
  </g>
  <!-- the shelf -->
  <rect x="262" y="780" width="500" height="22" rx="11" fill="#6f5ce0"/>
</svg>
